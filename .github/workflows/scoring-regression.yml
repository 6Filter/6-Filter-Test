name: Scoring Regression Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  duplicate-thresholds:
    name: Duplicate threshold check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/checkNoDuplicateThresholds.mjs

  regression:
    name: Scoring Regression Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Secret scan
        run: node scripts/scanCommittedSecrets.mjs
      - run: npm run test:regression
