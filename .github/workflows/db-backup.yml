name: Daily database backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set — add it in repo Settings → Secrets → Actions"
            exit 1
          fi
          pg_dump "$DATABASE_URL" --format=custom --exclude-table=research_cache \
            -f "primus-backup-$(date +%F).dump"
      - name: Upload to durable storage
        uses: actions/upload-artifact@v4
        with:
          name: primus-backup-${{ github.run_id }}
          path: "*.dump"
          retention-days: 90
      - name: Tell Slack the backup failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set — the failed backup was not posted to Slack"
            exit 0
          fi
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"Primus.AI database backup failed. Check GitHub Actions run ${{ github.run_id }}.\"}" \
            "$SLACK_WEBHOOK_URL"
