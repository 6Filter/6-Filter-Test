name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # Every 14 minutes
  workflow_dispatch:        # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App (web + db)
        run: |
          web=$(curl -sS -o /dev/null -w "%{http_code}" https://ck-6-filter-test.onrender.com)
          echo "$web"
          db=$(curl -sS -o /dev/null -w "%{http_code}" https://ck-6-filter-test.onrender.com/api/health)
          echo "$db"
          test "$web" = "200"
          test "$db" = "200"
