services:
  - type: web
    name: ck-6-filter-test
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://ck-6-filter-test.onrender.com
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: primus-ai-db
          property: connectionString
      - key: DEPT_PASSWORD_HASH_RD
        sync: false
      - key: DEPT_PASSWORD_HASH_CIA
        sync: false
      - key: DEPT_PASSWORD_HASH_MARKETING
        sync: false
      - key: DEPT_PASSWORD_HASH_NPD
        sync: false
      - key: DEPT_PASSWORD_HASH_MASTER
        sync: false
      - key: DEPT_API_KEY_RD
        sync: false
      - key: DEPT_API_KEY_CIA
        sync: false
      - key: DEPT_API_KEY_MARKETING
        sync: false
      - key: DEPT_API_KEY_NPD
        sync: false
      - key: DEPARTMENT_KEY_ENCRYPTION_SECRET
        sync: false

databases:
  - name: primus-ai-db
    plan: free
    databaseName: primus
    user: primus
    region: oregon
