services:
  - type: web
    name: primus-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: primus-ai-db
          property: connectionString

databases:
  - name: primus-ai-db
    plan: free
    databaseName: primus
    user: primus
    region: oregon
